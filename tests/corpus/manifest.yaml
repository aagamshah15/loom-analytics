# Loom detection corpus.
#
# Real-world CSVs used to measure template detection and dashboard output. The
# files themselves are not checked in: scripts/corpus_fetch.py downloads them
# into a local folder, and scripts/corpus_eval.py scores Loom against the
# `expected` labels below.
#
# expected  the template a reasonable user would expect, `generic` when none
#           applies, or a list when more than one answer is acceptable.
# notes     what makes the file's shape interesting.
#
# Tried and dropped (2026-10-12): aungpyaeap/supermarket-sales (403 from the Kaggle API),
# thedevastator/unlock-profits-with-e-commerce-sales-data "Amazon Sale Report.csv" (over the
# 50 MB ingestion limit), shriyashjagtap/e-commerce-customer-for-behavior-analysis (404).
#
# Labels were assigned from knowledge of each dataset and have not been checked
# against the downloaded headers yet. Fix any that the scorecard shows are wrong.

